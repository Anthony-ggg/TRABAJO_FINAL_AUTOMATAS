version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: compilador-db
    environment:
      POSTGRES_DB: compilador
      POSTGRES_USER: compilador
      POSTGRES_PASSWORD: compilador123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compilador -d compilador"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
